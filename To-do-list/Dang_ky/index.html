<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Dang_ki</title>
  </head>
  <body>
    <div class="logup_container">
      <form id="logup_box">
        <h1>Đăng ký</h1>
        <label for="username">Nhập tên đăng nhập:</label>
        <input type="text" id="username" autocomplete="username" required />
        <label for="password">Mật khẩu:</label>
        <input type="text" id="password" autocomplete="new-password" required />
        <button id="enter" type="submit">Đăng ký</button>
        <p class="login_link">
          Bạn đã có tài khoản?
          <a href="/To-do-list/Dang_nhap/index.html">Đăng nhập</a>
        </p>
        <p id="exists">Tên đăng nhập đã tồn tại.</p>
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
